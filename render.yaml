# Render deployment for the public demo.
#
# A free web service sleeps after 15 minutes and wipes its disk. Both are fine
# here and were fatal for the collector: the demo is request-driven, and the
# database ships with the deploy as a read-only file rather than being written
# at runtime.
#
# GROQ_API_KEY and GROQ_MODEL are set in the Render dashboard, not here.
services:
  - type: web
    name: duckstream
    runtime: python
    plan: free
    region: ohio
    buildCommand: pip install -r api/requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        sync: false
