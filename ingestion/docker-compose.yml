# Single-node Redpanda for local development.
#
# Runs on the laptop only. The capture VM does not run this — see
# docs/DECISIONS.md #3 for why the broker stays local.
#
# Start:  docker compose -f ingestion/docker-compose.yml up -d
# Stop:   docker compose -f ingestion/docker-compose.yml down
# Topics: docker exec -it redpanda rpk topic list

services:
  redpanda:
    # TODO: pin to a specific version once Phase 1 is stable. `latest` is fine
    # while iterating but makes the environment non-reproducible.
    image: docker.redpanda.com/redpandadata/redpanda:latest
    container_name: redpanda
    restart: unless-stopped
    command:
      - redpanda
      - start
      # --smp 1 and --overprovisioned keep Redpanda from assuming it owns the
      # machine. Without these it reserves aggressively and competes with
      # Docker Desktop and the Polars consumer for a 4-core laptop.
      - --smp=1
      - --overprovisioned
      - --memory=1G
      - --reserve-memory=0M
      - --node-id=0
      - --check=false
      # Two listeners: one for traffic inside the compose network, one for the
      # host. Without the split, clients on the host get handed an address they
      # cannot reach.
      - --kafka-addr=INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:19092
      - --advertise-kafka-addr=INTERNAL://redpanda:9092,EXTERNAL://localhost:19092
      - --rpc-addr=0.0.0.0:33145
      - --advertise-rpc-addr=redpanda:33145
    ports:
      - "19092:19092"   # Kafka API, from the host
      - "9644:9644"     # Admin API / metrics
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 15s
      timeout: 5s
      retries: 10

  # Optional but recommended while learning: a web UI at http://localhost:8080
  # showing topics, partitions, consumer groups, and message contents. Being
  # able to *see* offsets move makes the Kafka concepts land much faster.
  console:
    image: docker.redpanda.com/redpandadata/console:latest
    container_name: redpanda-console
    restart: unless-stopped
    depends_on:
      - redpanda
    ports:
      - "8080:8080"
    environment:
      KAFKA_BROKERS: redpanda:9092

volumes:
  redpanda_data:
